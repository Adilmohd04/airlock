# Netlify configuration for Airlock
# Agent-native data workspace with DuckDB-WASM running client-side

[build]
  # Build from the monorepo root
  command = "npm install && npm run build"
  publish = "apps/airlock/dist"

[build.environment]
  # Pinned to the Node major the build was actually verified on (v22.23.2)
  # rather than the floor in package.json (`engines.node: >=20`) — pinning a
  # version nobody has run the build against just moves the risk to deploy day.
  # Still not exercised on Netlify's build image; that needs a live deploy.
  NODE_VERSION = "22"

[context.production]
  # Production context
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  # Deploy previews for PR validation
  environment = { NODE_ENV = "production" }

[context.branch-deploy]
  # Branch deployments for feature testing
  environment = { NODE_ENV = "production" }

# Local model weights are served as real files under /models/. They MUST NOT be
# swept into the SPA catch-all below: T1-a's runtime proved that a `/*` → 200
# index.html rewrite makes a MISSING weight file resolve to the app shell
# (`200 text/html`), and WebLLM then "downloads" the HTML page in place of a
# tensor shard and dies deep in a parse — impossible to diagnose from a progress
# bar. This passthrough forces a missing weight to return a genuine 404 (and a
# present one to serve as-is), so the runtime's `probeHosted()` can tell
# "not mirrored here" apart from "downloaded". `status = 200` with the same path
# is Netlify's documented way to short-circuit later redirect rules for a prefix
# while still serving the static file when it exists.
[[redirects]]
  from = "/models/*"
  to = "/models/:splat"
  status = 200

# OCR language data (same-origin /tessdata/, mirrored by
# scripts/fetch-tessdata.mjs — never in git). Same SPA-catch-all hazard as
# /models/*: a missing traineddata file must 404, not return index.html.
[[redirects]]
  from = "/tessdata/*"
  to = "/tessdata/:splat"
  status = 200

# Redirect all OTHER non-file requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers for long-lived hashed assets (JS, CSS, WASM)
# Vite outputs hashed filenames: index-[hash].js, duckdb-[hash].wasm, etc.
# CORP set here too (not just in _headers' /assets/*.js rule) so it applies
# uniformly regardless of which config Netlify's edge prioritizes for a
# given path.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "cross-origin"

# Cache headers for demo data CSVs (also hashed by Vite)
[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Local model weights (served same-origin from /models/, mirrored by
# scripts/fetch-models.mjs — never in git). Long-lived immutable cache: a
# model directory is content-addressed by id, so once fetched it never changes.
# The compiled WebGPU kernel libraries under /models/lib/* need the wasm MIME
# because the site-wide `X-Content-Type-Options: nosniff` (in _headers) means a
# wrong or missing Content-Type is REJECTED, not sniffed — see _headers for the
# per-path rule.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/models/lib/*"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# OCR language data (same-origin /tessdata/, mirrored by
# scripts/fetch-tessdata.mjs). Immutable once mirrored.
[[headers]]
  for = "/tessdata/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# Ensure index.html is never cached (falls back for routing)
# NOTE: no Permissions-Policy `tools` directive on purpose. Chrome reported
# "Origin trial controlled feature not enabled: 'tools'" while our header
# carried `tools=(self)` next to a valid trial token — the directive fought
# the trial instead of helping host discovery. Default policy allows; the
# trial token alone gates exposure. Do NOT re-add without re-testing the
# pill in Chrome stable with only the token present.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Content-Type = "text/html; charset=UTF-8"
    Origin-Agent-Cluster = "?1"

# Catch-all for any .html files (same: no `tools` directive — see note above)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Content-Type = "text/html; charset=UTF-8"
    Origin-Agent-Cluster = "?1"
